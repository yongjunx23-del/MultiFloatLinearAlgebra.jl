name: Direct Micro4 GEMM Experiment

on:
  push:
    branches:
      - agent/bootstrap-linear-algebra
    paths:
      - "benchmark/direct_micro4.jl"
      - ".github/workflows/direct-micro4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-micro4:
    strategy:
      fail-fast: false
      matrix:
        size: [512, 1024]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - name: Instantiate benchmark environment
        run: julia --project=benchmark -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - name: Run direct four-column scheduling experiment
        shell: bash
        run: |
          set -o pipefail
          julia -t 4 --project=benchmark benchmark/direct_micro4.jl ${{ matrix.size }} | tee direct-micro4-${{ matrix.size }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-micro4-${{ matrix.size }}
          path: direct-micro4-${{ matrix.size }}.txt
