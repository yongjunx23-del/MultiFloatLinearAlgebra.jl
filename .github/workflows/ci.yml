name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  actions: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1.9", "1.10", "1.11", "1.12"]
        os: [ubuntu-latest, macos-14]
        threads: ["1", "4"]
    runs-on: ${{ matrix.os }}
    env:
      JULIA_NUM_THREADS: ${{ matrix.threads }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run tests with bounds checking
        run: julia --check-bounds=yes --project=. -e 'using Pkg; Pkg.test()'

  linearsolve-compat:
    name: LinearSolve compat (Julia ${{ matrix.julia-version }} / LS ${{ matrix.linearsolve-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - julia-version: "1.9"
            linearsolve-version: "2.22"
          - julia-version: "1.10"
            linearsolve-version: "3.83"
          - julia-version: "1.10"
            linearsolve-version: "4"
          - julia-version: "1.12"
            linearsolve-version: "5"
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - name: Run LinearSolve extension tests with pinned version
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.activate(; temp=true)
            Pkg.develop(path=".")
            Pkg.add(name="LinearSolve", version="${{ matrix.linearsolve-version }}")
            Pkg.add("MultiFloats")
            Pkg.add(name="SciMLBase", version="2")
            Pkg.add("Test"); Pkg.add("Random"); Pkg.add("LinearAlgebra")
            using Test, Random, LinearAlgebra, MultiFloats, MultiFloatLinearAlgebra,
                  LinearSolve, SciMLBase
            Random.seed!(0x5eed)
            function max_relative_error(A, B)
                @assert size(A) == size(B)
                setprecision(BigFloat, 512) do
                    numerator = BigFloat(0); denominator = BigFloat(0)
                    for i in eachindex(A, B)
                        a = BigFloat(A[i]); b = BigFloat(B[i])
                        numerator = max(numerator, abs(a - b))
                        denominator = max(denominator, abs(b))
                    end
                    numerator / max(denominator, BigFloat(1))
                end
            end
            function tolerance(::Type{T}, work::Int=1) where {T}
                setprecision(BigFloat, 512) do
                    BigFloat(4096 * max(work, 1)) * BigFloat(eps(T))
                end
            end
            include("test/linearsolve_extension.jl")
          '

  allocation-audit:
    name: Allocation audit (factor cache + kernels)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - name: Instantiate package environment
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run repeated-call allocation audit
        run: julia -t 1 --project=. benchmark/allocation_audit.jl 64
      - name: Run factor-cache allocation audit
        run: julia -t 1 --project=. benchmark/factor_cache_audit.jl 64
      - name: Run independent 512-bit BigFloat accuracy validation
        run: julia -t 1 --project=. benchmark/independent_accuracy.jl
      - name: Run allocation regression gate (hard)
        # Fails the workflow on nonzero exit if any warm-path measurement
        # exceeds its baked regression limit. See benchmark/allocation_gate.jl.
        run: julia -t 1 --project=. benchmark/allocation_gate.jl --check
