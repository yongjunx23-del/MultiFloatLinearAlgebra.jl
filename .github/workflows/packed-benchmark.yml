name: Packed GEMM Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - agent/bootstrap-linear-algebra
    paths:
      - .github/workflows/packed-benchmark.yml

permissions:
  actions: write
  contents: read

jobs:
  packed-gemm:
    strategy:
      fail-fast: false
      matrix:
        size: [512, 1024]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - name: Instantiate benchmark environment
        run: julia --project=benchmark -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - name: Run packed-panel throughput gate
        shell: bash
        run: |
          extra=""
          if [[ "${{ matrix.size }}" == "512" ]]; then
            extra="--generic"
          fi
          julia -t 4 --project=benchmark benchmark/packed_gemm.jl ${{ matrix.size }} $extra
