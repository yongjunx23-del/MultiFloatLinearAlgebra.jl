name: X3 Micro3 GEMM Experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x3-micro3:
    strategy:
      fail-fast: false
      matrix:
        size: [512, 1024]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - name: Instantiate benchmark environment
        run: julia --project=benchmark -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - name: Run x3 micro=3 experiment
        run: julia -t 4 --project=benchmark benchmark/x3_micro3.jl ${{ matrix.size }}
