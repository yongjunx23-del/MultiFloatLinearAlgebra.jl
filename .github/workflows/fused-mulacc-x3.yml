name: X3 MFIR Fused MulAcc Prototype

on:
  push:
    branches:
      - agent/bootstrap-linear-algebra
    paths:
      - "benchmark/fused_mulacc_x3.jl"
      - ".github/workflows/fused-mulacc-x3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fused-mulacc-x3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - name: Instantiate benchmark environment
        run: julia --project=benchmark -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - name: Run x3 MFIR fused mulacc validation and Vec4 dot benchmark
        shell: bash
        run: |
          set -o pipefail
          julia -t 1 --project=benchmark benchmark/fused_mulacc_x3.jl | tee fused-mulacc-x3.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fused-mulacc-x3
          path: fused-mulacc-x3.txt
