name: LDLT Scaling Benchmark

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ldlt:
    strategy:
      fail-fast: false
      matrix:
        size: [512, 1024]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - name: Instantiate benchmark environment
        run: julia --project=benchmark -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - name: Run LDLT scaling benchmark
        run: julia -t 4 --project=benchmark benchmark/ldlt_scaling.jl ${{ matrix.size }}
